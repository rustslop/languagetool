name: Release Builds

run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'Latest master build' }}

# This workflow is only responsible for building release artifacts:
#   - pushes of a v* tag -> versioned GitHub Release for that tag
#   - any non-tag push to master -> rolling "latest" builds (staged in the
#     latest/ directory of the workflow artifacts and republished to a
#     rolling `latest` prerelease)
on:
  push:
    tags: ["v*"]
    branches: [master]

concurrency:
  # One pipeline per ref: a newer master push cancels the superseded build,
  # tag builds are never cancelled.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # kache cache entries older than this are pruned by the cleanup job.
  KACHE_CACHE_TTL_DAYS: "14"
  # Frozen upstream LanguageTool revision the workspace embeds rule data
  # from at compile time. Must stay in sync with the local reference
  # checkout the sources are developed against.
  LT_FROZEN_REF: "2c9b51ea0746c341fd7edabfc753b1cff1f516c7"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Full OS x arch matrix on free runners only (public repo):
        #   - ubuntu/windows arm64 via the free -arm hosted labels
        #   - macos-latest is Apple Silicon arm64
        #   - Intel macOS (x86_64-apple-darwin) is cross-compiled on the
        #     Apple Silicon runner: free Intel macOS runners no longer exist
        #     and macos-latest-large is a paid larger runner. Apple clang
        #     links both arches natively, so no extra toolchain is needed.
        # Every job builds with an explicit --target (see build step), so the
        # artifact path is uniformly target/<triple>/release/.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      # og-langs embeds upstream rule data at compile time (include_str! into
      # languagetool/), but that directory is a gitignored local reference
      # checkout — CI must fetch the frozen upstream revision itself. Only
      # the resource files the build actually reads are fetched: blobless
      # partial clone + depth-1 fetch of the pinned commit + sparse checkout
      # of the .txt/.csv resource patterns (~170 MiB instead of a multi-GiB
      # full checkout).
      - name: Fetch pinned LanguageTool resources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/languagetool-org/languagetool.git languagetool
          git -C languagetool sparse-checkout set --no-cone \
            '/languagetool-language-modules/*/src/main/resources/**/*.txt' \
            '/languagetool-language-modules/*/src/main/resources/**/*.csv'
          git -C languagetool fetch --quiet --depth 1 origin "${LT_FROZEN_REF}"
          git -C languagetool checkout --quiet FETCH_HEAD
          echo "Fetched $(find languagetool -type f | wc -l) LanguageTool resource files."

      - name: Install Rust toolchain (workspace MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          # Explicit target install: the host may build a foreign triple
          # (x86_64-apple-darwin on Apple Silicon).
          targets: ${{ matrix.target }}

      # kache is the compiler cache for this workflow (it replaces
      # Swatinem/rust-cache). v2.0.0 ships prebuilt binaries for every
      # platform in the matrix above; its store persists through the regular
      # GitHub Actions cache service - no external storage configured.
      - name: Set up kache compiler cache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: v2.0.0
          # Release builds are all about the executables - cache those too.
          cache-executables: true
          # Keep release-build shards dense and scoped per target, never
          # shared with debug/test builds on the same store.
          manifest-key: release-${{ matrix.target }}
          cache-key-prefix: kache-release-${{ matrix.target }}
          max-size: 30GiB
          # Persist the local store through the built-in GitHub Actions cache.
          github-cache: true
          # Stats into the job summary; no sticky PR comment since this
          # workflow never runs against pull requests.
          job-summary: true
          pr-comment: false

      # Explicit --target keeps the artifact path uniform
      # (target/<triple>/release) for native and cross builds alike.
      - name: Build og-server (release)
        run: cargo build --release --locked --target ${{ matrix.target }} --bin og-server

      # Tag builds stage into dist/<tag>/, master builds into dist/latest/.
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          TARGET="${{ matrix.target }}"
          STAGE="og-server-${VERSION}-${TARGET}"

          mkdir -p "${STAGE}" "dist/${VERSION}"
          cp "target/${TARGET}/release/og-server" "${STAGE}/"
          tar -czf "dist/${VERSION}/${STAGE}.tar.gz" "${STAGE}"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = "${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          $Target = "${{ matrix.target }}"
          $Stage = "og-server-$Version-$Target"

          New-Item -ItemType Directory -Force -Path $Stage, "dist/$Version" | Out-Null
          Copy-Item "target/$Target/release/og-server.exe" -Destination $Stage
          Compress-Archive -Path $Stage -DestinationPath "dist/$Version/$Stage.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_type == 'tag' && format('release-{0}', matrix.target) || format('latest-{0}', matrix.target) }}
          path: dist/
          if-no-files-found: error
          # Archives are already compressed; don't burn CPU recompressing.
          compression-level: 0
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  publish:
    name: Publish ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || 'latest rolling release' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          ASSETS="dist/${VERSION}"

          (cd "${ASSETS}" && sha256sum og-server-* | tee SHA256SUMS.txt)

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Versioned release for the pushed tag. The release may already
            # exist when the workflow is re-run on the same tag.
            if ! gh release view "${VERSION}" >/dev/null 2>&1; then
              gh release create "${VERSION}" \
                --title "og-server ${VERSION#v}" \
                --generate-notes \
                --verify-tag
            fi
            gh release upload "${VERSION}" "${ASSETS}"/* --clobber
          else
            # Rolling `latest` prerelease, rebuilt on every non-tag push to
            # master. The moving tag does not match the v* trigger, and events
            # created by GITHUB_TOKEN never start new workflow runs, so this
            # cannot re-trigger the workflow.
            gh release delete latest --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create latest "${ASSETS}"/* \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Latest master build" \
              --notes "Rolling release builds from every non-tag push to \`master\`.

          - Commit: ${GITHUB_SHA}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets are replaced in place on every master push; the same files
          are also attached to each workflow run under the \`latest/\`
          directory of its build artifacts.

          The binaries check text with full rules only when a LanguageTool
          resource directory is present — download the language packs
          (\`langpack-core\` + your languages) from the rolling
          \`resources\` release and unpack them next to the binary."
          fi

  cleanup:
    # The cache store self-cleans on three levels:
    #   1. kache itself evicts its local store LRU-style beyond max-size.
    #   2. The GitHub Actions cache service enforces a 10 GiB per-repo LRU,
    #      expires entries unused for 7 days, and removes entries when their
    #      PR/branch ref disappears.
    #   3. This job bounds the steady state explicitly: kache entries the
    #      service kept but nothing restored for KACHE_CACHE_TTL_DAYS are
    #      dead weight from old runs and one-shot tag builds, so they are
    #      pruned after every pipeline.
    name: Prune stale kache caches
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Runs after build/publish have fully completed (cache saves included),
      # so it never races a live save; only entries past the TTL are touched.
      - name: Delete kache cache entries older than ${{ env.KACHE_CACHE_TTL_DAYS }} days
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d "-${KACHE_CACHE_TTL_DAYS} days" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Pruning kache-release-* caches created before ${CUTOFF}"

          # --key restricts this pipeline's kache entries only; caches that
          # belong to other workflows are never touched.
          IDS="$(gh cache list --key kache-release- --limit 1000 \
            --json id,createdAt --jq "
              map(select(.createdAt < \"${CUTOFF}\"))
              | sort_by(.createdAt)
              | .[].id")"

          if [[ -z "${IDS}" ]]; then
            echo "Nothing to prune."
            exit 0
          fi

          for id in ${IDS}; do
            gh cache delete "${id}"
          done
          echo "Pruned $(wc -l <<< "${IDS}") stale kache cache entries."

      - name: Report remaining kache cache footprint
        run: |
          set -euo pipefail
          gh cache list --key kache-release- --limit 1000 \
            --json key,sizeInBytes,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[]
                  | "\(.createdAt)  \((.sizeInBytes / 1048576) | floor) MiB  \(.key)"'
          echo "Total: $(gh cache list --key kache-release- --limit 1000 \
            --json sizeInBytes \
            --jq '[.[].sizeInBytes] | ((add // 0) / 1048576) | floor') MiB"
