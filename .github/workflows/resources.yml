name: Language Resource Packs

# Publishes the LanguageTool resource sets the release binaries need at
# runtime as downloadable language packs, under ONE stable rolling
# release tagged `resources` (no content hash in the tag). The binaries
# look for a ./languagetool/ directory (see find_lt_resource_dir() in
# og-langs); each pack unpacks exactly into that layout:
#
#   tar -xzf langpack-core.tar.gz      # always required (sentence SRX etc.)
#   tar -xzf langpack-en.tar.gz        # plus any languages you check
#
# A pack archive is replaced on the release only when its content
# actually changed. Packs are built byte-reproducibly (sorted names,
# zeroed ownership/timestamps, gzip -n), so the tarball's sha256 is a
# faithful content hash: the workflow compares it against the
# SHA256SUMS.txt published on the release and re-uploads only what
# differs. A change to one language therefore touches exactly that
# language's archive (plus langpack-all and the checksum file).
#
# Runs when the pack definition changes (this file) or the frozen
# upstream revision moves (it lives in release.yml). Manual dispatch
# covers repacks after new language crates appear under
# crates/og-langs/src/, which path filters cannot see.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/resources.yml
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  # Single rolling release: a newer run supersedes an in-flight one.
  group: resources
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match LT_FROZEN_REF in release.yml — the packs are cut from the
  # same frozen revision the binaries embed rule data from. A guard step
  # below fails the run if the two drift apart.
  LT_FROZEN_REF: "2c9b51ea0746c341fd7edabfc753b1cff1f516c7"

jobs:
  pack:
    name: Publish language packs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The implemented-language list is derived from the language crates
      # present in this checkout (intersected with upstream modules).
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Guard LT_FROZEN_REF against drift from release.yml
        run: |
          set -euo pipefail
          REL_REF="$(grep 'LT_FROZEN_REF:' .github/workflows/release.yml \
            | head -1 | sed 's/.*"\([0-9a-f]*\)".*/\1/')"
          if [ "${REL_REF}" != "${LT_FROZEN_REF}" ]; then
            echo "LT_FROZEN_REF drift: resources.yml has ${LT_FROZEN_REF}, release.yml has ${REL_REF}." >&2
            exit 1
          fi
          echo "Frozen refs in sync: ${LT_FROZEN_REF}"

      # Full resource fetch (dictionaries, hunspell, grammar.xml — not just
      # the txt/csv the build embeds): everything the runtime loads.
      - name: Fetch pinned LanguageTool resources
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/languagetool-org/languagetool.git languagetool
          git -C languagetool sparse-checkout set --no-cone \
            '/languagetool-language-modules/*/src/main/resources/**' \
            '/languagetool-core/src/main/resources/**' \
            '/COPYING.txt'
          git -C languagetool fetch --quiet --depth 1 origin "${LT_FROZEN_REF}"
          git -C languagetool checkout --quiet FETCH_HEAD

      # Each pack stages as languagetool/languagetool-language-modules/<lang>
      # (hardlinks, no copy cost) plus the LGPL COPYING.txt required for
      # redistribution.
      - name: Stage packs
        id: stage
        run: |
          set -euo pipefail
          LANGS="$(ls crates/og-langs/src | grep -E '^[a-z]{2,3}$' | sort \
            | while read -r l; do
                [ -d "languagetool/languagetool-language-modules/$l" ] || continue
                echo "$l"
              done | tr '\n' ' ')"
          LANGS="${LANGS% }"
          echo "Languages: ${LANGS}"
          [ -n "${LANGS}" ] || { echo "No languages matched" >&2; exit 1; }

          STAGE=".pack-stage"
          mkdir -p "${STAGE}/languagetool/languagetool-language-modules" \
                   "${STAGE}/languagetool/languagetool-core/src/main" \
                   "packs"
          cp languagetool/COPYING.txt "${STAGE}/languagetool/COPYING.txt"
          cp -al languagetool/languagetool-core/src/main/resources \
             "${STAGE}/languagetool/languagetool-core/src/main/"
          for lang in ${LANGS}; do
            mkdir -p "${STAGE}/languagetool/languagetool-language-modules/${lang}/src/main"
            cp -al "languagetool/languagetool-language-modules/${lang}/src/main/resources" \
               "${STAGE}/languagetool/languagetool-language-modules/${lang}/src/main/"
          done

          # Runtime dictionaries, OpenNLP models and hunspell word lists that
          # upstream LT does not track in git are frozen in resources-extra/
          # and overlaid onto the staged tree — without them the spellers
          # and taggers stay silent at runtime.
          cp -al resources-extra/languagetool/. "${STAGE}/languagetool/"

          echo "languages=${LANGS}" >> "$GITHUB_OUTPUT"
          echo "lang-count=$(wc -w <<< "${LANGS}")" >> "$GITHUB_OUTPUT"

      # Deterministic archives: sorted entry names, zeroed owner/group and
      # mtimes, gzip without a timestamp. Identical staged content then
      # yields a byte-identical tarball, which is what makes the per-pack
      # sha256 comparison below meaningful.
      - name: Build deterministic pack archives
        run: |
          set -euo pipefail
          pack() {
            local out="$1"; shift
            # Runs from inside .pack-stage; archives land in the repo-root
            # packs/ directory created by the staging step.
            tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='@0' -cf - "$@" | gzip -n > "../packs/${out}"
          }
          cd .pack-stage
          pack langpack-core.tar.gz \
            languagetool/languagetool-core languagetool/COPYING.txt
          for lang in ${{ steps.stage.outputs.languages }}; do
            pack "langpack-${lang}.tar.gz" \
              "languagetool/languagetool-language-modules/${lang}" \
              languagetool/COPYING.txt
          done
          # One-archive option for "just give me everything"; its content
          # changes whenever any language does, so it updates alongside.
          pack langpack-all.tar.gz languagetool
          cd ../packs
          ls -la
          sha256sum langpack-*.tar.gz | tee SHA256SUMS.txt

      # Compare freshly built checksums against what the rolling release
      # already carries; anything absent or differing needs (re-)upload.
      - name: Compare packs against the published release
        id: compare
        run: |
          set -euo pipefail
          if ! gh release view resources >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release 'resources' does not exist yet; will create it."
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          gh release download resources --pattern 'SHA256SUMS.txt' \
            --output published-SHA256SUMS.txt --clobber
          CHANGED=""
          while read -r sum name; do
            old="$(awk -v n="${name}" '$2 == n {print $1; exit}' published-SHA256SUMS.txt || true)"
            if [ "${old}" != "${sum}" ]; then
              CHANGED="${CHANGED} ${name}"
            fi
          done < packs/SHA256SUMS.txt
          # SHA256SUMS.txt itself is rewritten whenever anything changed.
          if [ -n "${CHANGED}" ]; then
            CHANGED="${CHANGED} SHA256SUMS.txt"
            echo "changed=${CHANGED# }" >> "$GITHUB_OUTPUT"
            echo "Changed packs:${CHANGED}"
          else
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "All packs identical to the published release; nothing to do."
          fi

      - name: Create the rolling resources release
        if: steps.compare.outputs.exists == 'false'
        run: |
          set -euo pipefail
          COUNT="${{ steps.stage.outputs.lang-count }}"
          gh release create resources packs/* \
            --target "${GITHUB_SHA}" \
            --title "Language resource packs (LT @ ${LT_FROZEN_REF:0:8})" \
            --notes "$(cat <<EOF
          Runtime resource packs for the \`og-server\` release binaries, cut
          from upstream LanguageTool @ \`${LT_FROZEN_REF}\` — the same frozen
          revision the binaries embed rule data from.

          The binaries look for a \`./languagetool/\` directory next to them
          (or a couple of parent dirs). Download, then unpack **core plus
          the languages you need** in the directory you run og-server from
          (\`.tar.gz\` extracts everywhere, Windows 10+ included — \`tar\`
          ships with it):

          \`\`\`bash
          tar -xzf langpack-core.tar.gz
          tar -xzf langpack-en.tar.gz   # plus any other languages
          ./og-server                   # now checks with full rules
          \`\`\`

          - \`langpack-core.tar.gz\` — always required (sentence segmentation,
            shared resources; tiny)
          - \`langpack-<lang>.tar.gz\` — ${COUNT} per-language packs
          - \`langpack-all.tar.gz\` — everything in one archive
          - \`SHA256SUMS.txt\` — checksums for all archives

          This is a rolling release: an archive is replaced here only when
          its content (its sha256) actually changes.
          EOF
          )"

      - name: Update changed packs on the release
        if: steps.compare.outputs.exists == 'true' && steps.compare.outputs.changed != ''
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 — intentional word splitting
          gh release upload resources $(for f in ${CHANGED}; do echo "packs/${f}"; done) \
            --clobber
          echo "Updated:${CHANGED}"
